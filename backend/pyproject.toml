[project]
name = "neo-trip-backend"
version = "0.1.0"
description = "Neo Trip CRM — backend (ядро CRM для туристического бизнеса)"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.40.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.17.0",
    "alembic-postgresql-enum>=1.9.0",
    "pydantic[email]>=2.12.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "pwdlib[argon2]>=0.2.1",
    "uuid-utils>=0.11.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "mypy>=1.19.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff — линтер и форматтер (заменяет flake8 / black / isort)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "TID",    # flake8-tidy-imports
]
ignore = [
    "B008",     # вызов функции в аргументе по умолчанию — это идиома Depends() в FastAPI
    # Правила о «неоднозначных» символах рассчитаны на латиницу и срабатывают на
    # каждую русскую букву в строках и комментариях. В проекте с русскоязычными
    # сообщениями они дают только шум.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy — строгая статическая типизация
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["alembic/", "\\.venv/"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*", "alembic_postgresql_enum.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]
