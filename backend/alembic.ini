[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# URL подключения намеренно не задан здесь: он читается в alembic/env.py
# из настроек приложения, чтобы пароль не попадал в репозиторий.
sqlalchemy.url =

# Форматирование сгенерированных миграций запускается отдельной командой
# (uv run ruff format alembic/versions), а не хуком: хук требует ruff как
# console_scripts-entrypoint, которого нет при установке через uv.
[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
